<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Code Linkify</title>
    <!-- Styling for bulleted list -->
    <style>
        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f6f8fa;
        }

        h2 {
            font-size: 14px;
            margin: 0 0 12px 0;
            color: #24292f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: #dfe2e5;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        button:hover {
            background: #d0d7de;
        }

        /* Group Layout Rules */
        .domain-container {
            margin-bottom: 14px;
        }

        .domain-title {
            font-weight: bold;
            font-size: 13px;
            color: #24292f;
            margin-bottom: 4px;
            display: block;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 2px;
        }

        /* Bulleted List Layout */
        .url-bullet-list {
            margin: 0;
            padding-left: 20px;
            list-style-type: disc;
        }

        .url-item {
            margin: 6px 0;
            font-size: 12px;
        }

        .url-link {
            color: #ff6b00;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }

        .url-link:hover {
            text-decoration: underline;
        }

        .empty-msg {
            font-size: 12px;
            color: #57606a;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="header" width="100%" style="display: flex; align-items: center; gap: 10px;">
        <img src="icons/icon64.png" alt="Extension Icon" width="64" height="64">
        <h1>Github Code Linkify</h1>
        <div class="badge-container" style="margin-top: 10px;">
            <img src="icons/version-badge.svg" alt="Extension Version" class="badge-img" />
        </div>
    </div>

    <div class="subheader">
        <p>This extension scans the current page for links and displays them in a popup. Click on any link to open it in
            a new tab!</p>
        <button id="myButton">Test alert</button>
        <button id="scanButton">Scan Links</button>
    </div>
    <div class="URLs" style="margin-top: 10px;">
        <h2>
            <span>Saved/Clicked Links</span>
            <button id="clear-btn">Clear All</button>
        </h2>
        <!-- Changed container from a <ul> to a flexible display <div> -->
        <div id="list-container"></div>
        <h3>Scanned URLs found on tab:</h3>
        <ul id="urlList">
            <li>Insert list of URLs here</li>
        </ul>

    </div>
    </div>
    <script src="popup.js"></script>
</body>
<!-- <script class="links" src="script.js"></script> -->
