<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Code Linkify</title>
    <!-- Styling for bulleted list -->
    <style>
        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #f6f8fa;
        }

        h2 {
            font-size: 14px;
            margin: 0 0 12px 0;
            color: #24292f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: #dfe2e5;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        button:hover {
            background: #d0d7de;
        }

        /* Group Layout Rules */
        .domain-container {
            margin-bottom: 14px;
        }

        .domain-title {
            font-weight: bold;
            font-size: 13px;
            color: #24292f;
            margin-bottom: 4px;
            display: block;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 2px;
        }

        /* Bulleted List Layout */
        .url-bullet-list {
            margin: 0;
            padding-left: 20px;
            list-style-type: disc;
        }

        .url-item {
            margin: 6px 0;
            font-size: 12px;
        }

        .url-link {
            color: #ff6b00;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }

        .url-link:hover {
            text-decoration: underline;
        }

        .empty-msg {
            font-size: 12px;
            color: #57606a;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <!-- Outer header container pushing column 1 (left) and column 2 (right) apart -->
    <div class="header"
        style="width: 100%; display: flex; align-items: center; justify-content: flex-start; gap: 15px; margin-bottom: 15px;">
        <!-- COLUMN 1 (Left Side): Just the icon alone -->
        <div style="display: flex; align-items: center; justify-content: center; min-width: 64px;">
            <img src="icons/icon64.png" alt="Extension Icon" width="48" height="48"
                style="display: block; object-fit: contain;">
        </div>

        <!-- COLUMN 2 (Right Side): Title and Badge stacked vertically -->
        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px;">
            <h1 id="extension-name" style="margin: 0; font-size: 24px; font-weight: bold; color: #24292f; line-height: 1.2;">
                <!-- Repo name: Github Code Linkify -->
            </h1>

            <!-- Clickable Badge wrapper under the title -->
            <div class="badge-container" style="display: block; line-height: 0;">
                <a id="extension-repo" href="#" target="_blank" rel="noopener noreferrer"
                    style="display: block; border: none; outline: none;">
                    <img src="icons/version-badge.svg" alt="Extension Version" class="badge-img"
                        style="display: block; max-width: 100%; height: auto;" />
                </a>
                <p id="repo-text">Repository</p>
                <a id="extension-tab-view" href="#" target="_blank" rel="noopener noreferrer">Open pop up in new tab</a>
                <!-- TODO: add option to open in side bar view instead of pop up/new tab -->
            </div>
        </div>
    </div>

    <div class="subheader">
        <p id="extension-description">
            <!-- Description: This extension scans the current page for links and displays them in a popup. Click on any link to open it in a new tab, and view your history in the popup! -->
        </p>
        <button id="scanButton">Scan Links</button>
    </div>
    <div class="URLs" style="margin-top: 10px;">
        <h2>
            <span>Saved/Clicked Links</span>
            <button id="clear-btn">Clear All</button>
        </h2>
        <!-- Changed container from a <ul> to a flexible display <div> -->
        <div id="list-container"></div>
        <h3>Scanned URLs found on tab:</h3>
        <ul id="urlList">
            <li>Insert list of URLs here</li>
        </ul>

    </div>
    </div>
    <script src="popup.js"></script>
</body>
<!-- <script class="links" src="script.js"></script> -->

</html>
