<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Code Linkify</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="popup-header">
        <div class="header-main">
            <div style="display: flex; align-items: center; justify-content: center; min-width: 64px;">
                <img src="icons/icon64.png" alt="Extension Icon" width="48" height="48"
                    style="display: block; object-fit: contain;">
            </div>

            <div class="header-meta">
                <h1 id="extension-name" style="margin: 0; font-size: 24px; font-weight: bold; color: var(--text); line-height: 1.2;">
                    <!-- Repo name: Github Code Linkify -->
                </h1>

                <div class="badge-container" style="display: block; line-height: 0;">
                    <a id="extension-repo" title="View Repository" href="#" target="_blank" rel="noopener noreferrer"
                        style="display: block; border: none; outline: none;">
                        <img src="icons/version-badge.svg" alt="Extension Version Badge" class="badge-img"
                            style="display: block; max-width: 100%; height: auto;" />
                    </a>
                    <!-- <a id="extension-tab-view" href="#" target="_blank" rel="noopener noreferrer"> -->
                        <!-- <p>Open pop up in new tab</p></a> -->
                </div>
            </div>
        </div>

        <div class="settings-wrap">
            <button id="settings-button" class="settings-button" type="button" aria-label="Open settings" title="Settings">
                ⚙
            </button>

            <div id="settings-menu" class="settings-menu" role="menu" aria-hidden="true">
                <button class="menu-item setting-toggle" type="button" data-setting="autoScanOnOpen">
                    <span>Auto scan on popup open</span>
                    <span class="toggle-state">On</span>
                </button>
                <button class="menu-item setting-toggle" type="button" data-setting="darkMode">
                    <span>Dark mode</span>
                    <span class="toggle-state">Off</span>
                </button>
                <button class="menu-item setting-toggle" type="button" data-setting="showBadge">
                    <span>Code-aware badge</span>
                    <span class="toggle-state">On</span>
                </button>
                <button class="menu-item setting-toggle" type="button" data-setting="enableBaseUrlCheck">
                    <span>Enable base URL awareness</span>
                    <span class="toggle-state">On</span>
                </button>
                <button class="menu-item setting-toggle" type="button" data-setting="enableKeywordCheck">
                    <span>Enable keyword awareness</span>
                    <span class="toggle-state">On</span>
                </button>
                <button class="menu-item action-item" type="button" id="add-awareness" title="Adds this site's hostname to code awareness so matching pages are treated as code-aware." aria-label="Add current site to awareness">
                    <span>Add current site to awareness</span>
                </button>
                <button class="menu-item action-item" type="button" id="share-repo">
                    <span>Share repo</span>
                </button>
                <button class="menu-item action-item" type="button" id="open-options">
                    <span>Advanced settings</span>
                </button>
            </div>
        </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite">link copied</div>

    <div class="subheader">
        <p id="extension-description">
            <!-- Description: This extension scans the current page for links and displays them in a popup. Click on any link to open it in a new tab, and view your history in the popup! -->
        </p>
        <button id="scanButton">Scan Links</button>
    </div>
    <div class="URLs" style="margin-top: 10px;">
        <h2>
            <span>Saved/Clicked Links <span id="saved-links-count"></span></span>
            <button id="clear-btn">Clear All</button>
        </h2>
        <!-- Changed container from a <ul> to a flexible display <div> -->
        <div id="list-container"></div>
        <h3>Scanned URLs found on tab:</h3>
        <ul id="urlList">
            <li>Insert list of URLs here</li>
        </ul>

    </div>
    <!-- TODO: enable if using favicon for deployment to web store -->
    <!-- <a href="https://www.flaticon.com/free-icons/hyperlink" title="hyperlink icons">Hyperlink icons created by Freepik - Flaticon</a> -->
    </div>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
</body>
<!-- <script class="links" src="script.js"></script> -->

<!-- Favicon credit URL: -->


</html>
