<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Code Linkify Settings</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <main class="options-shell">
        <header class="options-header">
            <div>
                <p class="eyebrow">Github Code Linkify</p>
                <div class="options-brand-row">
                    <a id="options-repo" class="options-badge-link" title="View Repository" href="#" target="_blank" rel="noopener noreferrer">
                        <img src="icons/version-badge.svg" alt="Extension Version Badge" class="options-badge">
                    </a>
                </div>
                <h1>Advanced settings</h1>
                <p class="intro">Manage the sites and URL patterns that the extension treats as code-aware.</p>
            </div>
            <img src="icons/icon64.png" alt="Extension icon" width="56" height="56">
        </header>

        <section class="settings-section" aria-labelledby="behavior-heading">
            <div class="section-heading">
                <h2 id="behavior-heading">Behavior</h2>
                <p>Choose how the popup and page awareness behave.</p>
            </div>
            <div class="setting-grid">
            </div>
        </section>

        <section class="settings-section" aria-labelledby="sites-heading" data-setting-section="awareBaseUrls">
            <div class="section-heading section-heading-row">
                <div>
                    <h2 id="sites-heading"></h2>
                    <p></p>
                </div>
                <button class="clear-list-button" id="clear-sites" type="button">Clear all</button>
            </div>
            <form class="add-form" id="site-form">
                <label class="sr-only" for="site-input"></label>
                <input id="site-input" type="text" autocomplete="off">
                <button type="submit"></button>
            </form>
            <ul class="active-list" id="site-list" aria-live="polite"></ul>
        </section>

        <section class="settings-section" aria-labelledby="keywords-heading" data-setting-section="awareKeywords">
            <div class="section-heading section-heading-row">
                <div>
                    <h2 id="keywords-heading"></h2>
                    <p></p>
                </div>
                <button class="clear-list-button" id="clear-keywords" type="button">Clear all</button>
            </div>
            <form class="add-form" id="keyword-form">
                <label class="sr-only" for="keyword-input"></label>
                <input id="keyword-input" type="text" autocomplete="off">
                <button type="submit"></button>
            </form>
            <ul class="active-list" id="keyword-list" aria-live="polite"></ul>
        </section>

        <footer class="options-footer">
            <button class="reset-button" id="reset-settings" type="button">Reset all settings to default</button>
            <span id="save-status" role="status" aria-live="polite"></span>
        </footer>
    </main>
    <script src="settings.js"></script>
    <script src="options.js"></script>
</body>

</html>
